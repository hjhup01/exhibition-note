# 디자인 시안 C '다크 갤러리': 어두운 전시실 + 금색 포인트
[theme]
base = "dark"
primaryColor = "#c9a45c"
backgroundColor = "#16171b"
secondaryBackgroundColor = "#1f2026"
textColor = "#ecebe6"
linkColor = "#d8b46a"
borderColor = "#2e2f36"
baseRadius = "0.6rem"

[theme.sidebar]
backgroundColor = "#101114"
secondaryBackgroundColor = "#1f2026"

[server]
maxUploadSize = 10  # 관람 사진 올리기 한도(MB). exhibition_app/photos.py의 MAX_UPLOAD_BYTES와 같게 둔다
