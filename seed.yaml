assumptions:
- 외부 API(문화포털·카카오·Bedrock·LangSmith)는 테스트에서 모킹하며, 모든 테스트는 네트워크와 실제 키 없이 통과한다. 시간 초과는 timeout 예외를 모킹해 확인한다
- 테스트는 DB_PATH를 임시 디렉터리로 지정하고, '오늘'은 고정된 날짜를 주입해 확인한다
- 화면 로직은 테스트 가능한 함수(전시 파싱·필터, 관련 글 정리, 프롬프트 생성, 요약 자르기, 설정 로드, 레코드 저장소)로 분리하고 Streamlit 화면은 이 함수를 호출한다. '보인다'는 화면 함수가 Streamlit에 넘기는 값(문구·목록)으로 검증한다
- 모델 ID 선택(BEDROCK_MODEL_ID → DEFAULT_BEDROCK_MODEL_ID)은 제약이며 tests/test_summary.py의 단위 테스트로 함께 확인한다
- 의존성은 requirements.txt에 적는다(streamlit, requests, langchain-aws, langsmith, python-dotenv, pytest)
- 문화포털 필드명(seq, title, realmName, area, place, startDate, endDate)은 공개 명세 기준이며, 실제 응답과 다르면 exit_conditions의 요구사항 충돌로 보고한다
ontology_schema:
  name: ArtExhibitionTracker
  description: 공공 API의 미술 전시, 세 화면(목록·상세·내 전시), 목록 필터, 저장 기록과 상태 전환, 매번 새로 조회하고 저장하지 않는 관련 글과 요약, 설정, 고정 안내 문구
  fields:
  # Exhibition (문화포털 응답을 매핑한 값)
  - {name: exhibition_id, type: string, description: '[Exhibition] 문화포털 seq(숫자면 문자열로 변환)', required: true}
  - {name: title, type: string, description: '[Exhibition] 문화포털 title(공백만은 불가)', required: true}
  - {name: category, type: string, description: "[Exhibition] 문화포털 realmName. 값이 정확히 '전시'인 항목만 대상(실제 API에 '미술' 값 없음)", required: true}
  - {name: start_date, type: string, description: '[Exhibition] startDate(YYYYMMDD)를 YYYY-MM-DD로 변환. end_date 이하', required: true}
  - {name: end_date, type: string, description: '[Exhibition] endDate(YYYYMMDD)를 YYYY-MM-DD로 변환', required: true}
  - {name: region, type: string, description: '[Exhibition] 문화포털 area(시·도). 없으면 빈 문자열', required: true}
  - {name: place, type: string, description: '[Exhibition] 문화포털 place. 없으면 빈 문자열', required: true}
  # Views (화면)
  - {name: sidebar, type: object, description: '[Sidebar] 앱 이름, 페이지 선택(전시 찾기 / 내 전시(저장 건수)), 전시 찾기 페이지일 때 기간·지역·키워드 필터 입력', required: true}
  - {name: exhibition_list_view, type: object, description: '[ExhibitionListView] 전시 찾기 페이지의 왼쪽 단. 미술 전시 목록(제목, 장소·지역·기간, 진행중/예정 표시), 선택한 전시 강조, 공공 API 실패·0건 문구', required: true}
  - {name: exhibition_detail_view, type: object, description: "[ExhibitionDetailView] 전시 찾기 페이지의 오른쪽 단. 위에서부터 제목·장소·기간, 관심 저장 버튼, 요약 영역, 웹문서 영역, 블로그 영역. 선택 전에는 '왼쪽 목록에서 전시를 선택하세요'", required: true}
  - {name: my_exhibitions_view, type: object, description: '[MyExhibitionsView] 탭 = 관심, 관람예정, 관람완료. 각 탭은 해당 status의 행을 updated_at 내림차순으로 스냅샷 값으로 표시. 모든 탭에 전시 기록 삭제, 관람예정 탭에 예정일 변경과 관람완료 버튼, 관심 탭에 관람예정 지정, 관람완료 탭에 관람평 작성·수정·삭제', required: true}
  # ExhibitionFilter (목록 화면 입력, 모두 AND, 오늘 = Asia/Seoul 날짜)
  - {name: period_filter, type: string, description: '[ExhibitionFilter] enum 진행중 | 진행예정 | 전체(기본). 진행중 = start_date ≤ 오늘 ≤ end_date(양 끝 포함), 진행예정 = start_date > 오늘', required: true}
  - {name: region_filter, type: string, description: "[ExhibitionFilter] 선택지 = '전체'(기본, 조건 없음) + 조회된 미술 전시의 비어 있지 않은 region 값(중복 제거, 가나다순). region이 빈 전시는 '전체'에서만 보임", required: true}
  - {name: keyword_filter, type: string, description: '[ExhibitionFilter] 앞뒤 공백 제거 후 앞 50자, 대소문자 무시 제목 부분 일치. 비우면 조건 없음', required: false}
  # SavedExhibition (SQLite saved_exhibition 테이블 한 행)
  - {name: saved_exhibition, type: object, description: '[SavedExhibition] exhibition_id UNIQUE. 쓰기는 트랜잭션, 실패 시 롤백. 전시 기록 삭제 시 행 전체 삭제', required: false}
  - {name: api_snapshot, type: object, description: '[SavedExhibition] 저장 시점의 {exhibition_id, title, category, region, place, start_date, end_date}. 이후 갱신 안 함', required: true}
  - {name: status, type: string, description: '[SavedExhibition] enum 관심 | 관람예정 | 관람완료. 저장 직후 관심', required: true}
  - {name: planned_visit_date, type: string, description: '[SavedExhibition] nullable. 관심이면 NULL, 관람예정·관람완료이면 NOT NULL. 실제 달력 날짜 YYYY-MM-DD, 과거 허용. 변경은 관람예정에서만', required: false}
  - {name: review_rating, type: integer, description: '[SavedExhibition] nullable. 관람평 작성 전·관람평 삭제 후 NULL. 값은 1~5이며 관람완료일 때만 가질 수 있음', required: false}
  - {name: review_text, type: string, description: '[SavedExhibition] nullable. review_rating과 함께 NULL이거나 함께 값을 가짐. 앞뒤 공백 제거 후 1~1000자', required: false}
  - {name: created_at, type: string, description: '[SavedExhibition] 저장 시각 ISO-8601', required: true}
  - {name: updated_at, type: string, description: '[SavedExhibition] 마지막 변경 시각 ISO-8601', required: true}
  # StatusTransition (허용 전환표)
  - {name: status_transitions, type: array, description: '[StatusTransition] 허용 = [관심→관람예정(planned_visit_date 필요), 관람예정→관람완료(planned_visit_date 유지, review 필드는 NULL로 시작)]. 그 밖의 전환(되돌리기, 관심→관람완료)은 거부되고 행은 바뀌지 않음', required: true}
  # AppConfig (.env)
  - {name: app_config, type: object, description: '[AppConfig] BEDROCK_MODEL_ID(없거나 공백이면 DEFAULT_BEDROCK_MODEL_ID), DB_PATH(기본 ./data/exhibitions.db), LANGSMITH_*, AWS·카카오·공공데이터 키. 키 값은 화면·로그에 출력 안 함', required: true}
  # Transient (저장 안 함)
  - {name: related_news, type: array, description: '[RelatedItem, 저장 안 함] {title: HTML 제거 문자열(표시), link: string(표시), pub_date: YYYY-MM-DD(표시), description: HTML 제거 문자열(프롬프트에만 사용)}. 앱이 pub_date 내림차순 정렬 후 최대 5건', required: false}
  - {name: related_blogs, type: array, description: '[RelatedItem, 저장 안 함] related_news와 같은 구조. 앱이 pub_date 내림차순 정렬 후 최대 5건', required: false}
  - {name: llm_summary, type: string, description: '[Summary, 저장 안 함] 비어 있지 않은 줄 최대 5줄. 0줄·LLM 실패·관련 글 없음이면 요약 영역 미표시', required: false}
  # UiMessage (고정 문구)
  - {name: ui_message, type: string, description: "[UiMessage] enum: '전시 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.' | '관련 글을 불러오지 못했습니다.' | '결과 없음' | '이미 저장된 전시입니다' | '기록 저장소를 열 수 없습니다. DB_PATH를 확인해 주세요.'", required: false}
evaluation_principles:
- {name: 요구 범위 충실성, weight: 0.3, description: '미술 필터, 웹문서·블로그 각 5건과 5줄 이하 요약, 앞 방향 수동 상태 전환, 관람완료 후 관람평, 내 전시 탭을 모두 구현하고 사진·동행인·로그인은 넣지 않는다'}
- {name: 장애 내성, weight: 0.2, description: '외부 호출 실패·10초 초과·잘못된 응답·0건·일부 실패·빈 LLM 응답·DB 열기 실패·LangSmith 장애에서도 예외 없이 정해진 방식으로 대응한다'}
- {name: 데이터 정합성, weight: 0.2, description: 'UNIQUE 제약과 트랜잭션 롤백, 허용 전환표, NULL 규칙, 입력 범위 검사, 스냅샷 고정, 재시작 후 유지, 관련 글·요약 비저장을 지킨다'}
- {name: 기술 스택 준수, weight: 0.2, description: 'Streamlit, SQLite, 문화포털 필드 매핑, 카카오 검색 API, LangChain ChatBedrock, LangSmith, .env 설정, 프롬프트 구성 규칙을 지킨다'}
- {name: 검증 가능성, weight: 0.1, description: 각 완료 기준이 하나의 테스트 파일로 네트워크 없이 확인된다}
exit_conditions:
- {name: 모든 완료 기준 통과, description: 열한 개 완료 기준의 검증 명령이 모두 성공한다, criteria: '각 완료 기준의 verify_command(테스트 파일 11개)가 모두 통과'}
- {name: 외부 의존 차단, description: 필수 API 키나 모델 접근 권한이 없어 실제 연동을 확인할 수 없다, criteria: '모든 테스트 파일은 통과하고 실제 키가 필요한 확인만 남으면 그 사실을 보고하고 종료'}
- {name: 요구사항 충돌, description: "문화포털 실제 응답에 realmName·area 등 매핑 필드가 없거나 '미술' 값이 없어 확정 요구를 그대로 구현할 수 없다", criteria: '충돌 내용을 기록하고 사용자 확인이 필요하다고 보고한 뒤 종료'}
